name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Publishing the committed demo dataset as-is. To publish real data
      # instead, replace this with `python -m pipeline all` — note that it
      # downloads a few hundred megabytes from Cricsheet, so cache ~/.cache
      # or build the dataset elsewhere and commit it.
      - name: Ensure a dataset is present
        run: |
          if [ ! -f web/data/manifest.json ]; then
            python -m pipeline seed
          fi
          python scripts/check_dataset.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
