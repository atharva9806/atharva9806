name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The pipeline is standard library only, so there is nothing to install.
      - name: Python pipeline tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      # The committed dataset is real Cricsheet data, so a fresh seed must not
      # overwrite it. Build the demo into a scratch directory instead: that
      # still exercises simulate -> parse -> aggregate -> analyse -> export end
      # to end, which is the point of the step.
      - name: Build the demo dataset into a scratch directory
        run: python -m pipeline seed --out /tmp/demo-data

      - name: Verify the committed dataset
        run: python scripts/check_dataset.py

      - name: JavaScript analysis tests
        run: node --test tests/js/*.test.mjs
